spring:
  application:
    name: ai-agent-chat-system
  config:
    import: optional:file:.env[.properties]
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ai_chat}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    # Optional: Uncomment to use H2 in-memory database for development
    # url: jdbc:h2:mem:ai_chat
    # driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  
  # Spring AI Configuration (static providers at startup).
  # Additional providers can be registered at runtime via POST /api/models/registry with optional models list and defaultModel.
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4}
          temperature: 0.7
          max-tokens: 2000
    
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-3-opus-20240229}
          temperature: 0.7
          max-tokens: 2000
    
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama2}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production}
  expiration: ${JWT_EXPIRATION:604800000} # 7 days in milliseconds
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000} # 30 days

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

# MCP: context-injection style (first style). The backend calls default-context-tool(s) with the user
# message (and optional query-transforms), then injects tool results into the prompt. The model does
# not choose tools. Add servers via Settings (MCP tab) or here. When at least one server is configured,
# MCP is enabled. Each server defines its own default-context-tool(s) and query-transforms.
mcp:
  servers:
    # -------------------------------------------------------------------------
    # GitHub MCP (remote): repos, issues, PRs, code search. Requires GITHUB_PAT.
    # -------------------------------------------------------------------------
    github:
      url: https://api.githubcopilot.com/mcp/
      request-timeout-seconds: 30
      headers:
        Authorization: "Bearer ${GITHUB_PAT:}"
      default-context-tool: search_repositories
      query-transforms:
        search_repositories:
          - pattern: "(?:repos?(?:itories)?|repo)\\s+(?:from|for|in)\\s+([a-zA-Z0-9][a-zA-Z0-9_-]*)"
            template: "user:$1"
          - pattern: "(?:get|list|show|can you list)\\s+(?:repos?(?:itories)?|repo)\\s+(?:from|for|in)\\s+([a-zA-Z0-9][a-zA-Z0-9_-]*)"
            template: "user:$1"

    # -------------------------------------------------------------------------
    # Example: second MCP server with its own tools and transforms
    # -------------------------------------------------------------------------
    # slack:
    #   url: https://example.com/slack-mcp
    #   request-timeout-seconds: 30
    #   headers:
    #     Authorization: "Bearer ${SLACK_TOKEN:}"
    #   default-context-tool: list_channels
    #   query-transforms: {}

    # -------------------------------------------------------------------------
    # Example: local or other Streamable HTTP MCP server (no context tools)
    # -------------------------------------------------------------------------
    # local:
    #   url: http://localhost:8081/mcp
    #   request-timeout-seconds: 30
    #   # Omit default-context-tool to skip context injection for this server
    #   # Omit query-transforms or leave {} to use raw user message as query

# SpringDoc OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    com.aiagent: DEBUG
    org.springframework.ai: DEBUG
    # MCP Java SDK: reduce noise from 405 when server only supports Streamable HTTP (POST), not GET/SSE
    # io.modelcontextprotocol.client.LifecycleInitializer: ERROR

