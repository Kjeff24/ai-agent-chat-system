<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Agent Chat System</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Polyfill for Node.js global variable
    if (typeof global === 'undefined') {
      var global = window;
    }
    // Apply theme before paint to avoid flash
    (function() {
      var t = localStorage.getItem('theme');
      var dark = t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', !!dark);
    })();
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors">
  <app-root></app-root>
</body>
</html>
