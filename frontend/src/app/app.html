@if (isLoggedIn) {
  <div class="min-h-screen bg-gradient-to-br from-gray-50 via-white to-gray-50 dark:from-gray-900 dark:via-gray-900 dark:to-gray-800 transition-colors">
    <!-- Header -->
    <header class="bg-white dark:bg-gray-900/95 shadow-sm border-b border-gray-200 dark:border-gray-700 sticky top-0 z-50 backdrop-blur-sm transition-colors">
      <div class="w-full px-3 sm:px-4">
        <div class="flex items-center justify-between h-14 sm:h-16">
          <div class="flex items-center space-x-2 sm:space-x-3">
            <button
              type="button"
              class="lg:hidden p-2 rounded-lg text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
              (click)="toggleSidebar()"
              [title]="sidebarOpen ? 'Close sidebar' : 'Open sidebar'"
            >
              @if (sidebarOpen) {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path>
                </svg>
              } @else {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
              }
            </button>
            <div class="w-7 h-7 sm:w-8 sm:h-8 bg-gradient-to-br from-primary-600 to-primary-700 rounded-lg flex items-center justify-center shadow-sm">
              <svg class="w-4 h-4 sm:w-5 sm:h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
              </svg>
            </div>
            <h1 class="text-lg sm:text-xl font-bold text-gray-900 dark:text-white">{{ title }}</h1>
          </div>
          <div class="flex items-center space-x-2 sm:space-x-3">
            <button
              type="button"
              (click)="openSettings()"
              class="p-2 rounded-lg text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
              title="Settings – model providers and configs"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              </svg>
            </button>
            <button
              type="button"
              (click)="themeService.toggle()"
              class="p-2 rounded-lg text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
              [title]="themeService.isDark ? 'Switch to light mode' : 'Switch to dark mode'"
            >
              @if (themeService.isDark) {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
              } @else {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
              }
            </button>
            <div class="hidden sm:flex items-center space-x-2 text-xs sm:text-sm text-gray-600 dark:text-gray-400">
              <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse-slow"></div>
              <span class="hidden md:inline">Connected</span>
            </div>
            <button type="button" (click)="logout()" class="btn-secondary text-sm">
              Log out
            </button>
          </div>
        </div>
      </div>
    </header>
    
    <!-- Main Content -->
    <main class="w-full px-2 sm:px-3 py-2 sm:py-3 relative">
      <!-- Mobile: backdrop when sidebar open -->
      @if (sidebarOpen) {
        <div
          class="fixed inset-0 z-30 lg:hidden bg-black/30 transition-opacity"
          (click)="toggleSidebar()"
          role="button"
          tabindex="0"
          aria-label="Close sidebar"
        ></div>
      }
      <!-- Mobile: sidebar overlay slides in from left -->
      <aside
        class="lg:hidden fixed left-0 top-14 sm:top-16 bottom-0 z-40 w-72 max-w-[85vw] overflow-hidden transition-transform duration-200 ease-out flex flex-col bg-white dark:bg-gray-800 rounded-r-lg shadow-xl border-r border-gray-200 dark:border-gray-700"
        [class.translate-x-0]="sidebarOpen"
        [class.-translate-x-full]="!sidebarOpen"
      >
        <div class="h-full overflow-hidden rounded-r-lg">
          <app-conversation-list
            [collapsed]="false"
            (toggleSidebar)="toggleSidebar()"
          ></app-conversation-list>
        </div>
      </aside>
      <!-- Desktop: inline sidebar + chat (no gap between them) -->
      <div class="flex flex-col lg:flex-row gap-2 lg:gap-0 h-[calc(100vh-4.5rem)] sm:h-[calc(100vh-5rem)]">
        <aside
          class="hidden lg:flex flex-shrink-0 order-2 lg:order-1 transition-all duration-200 ease-in-out overflow-hidden w-fit"
        >
          <app-conversation-list
            [collapsed]="!sidebarOpen"
            (toggleSidebar)="toggleSidebar()"
          ></app-conversation-list>
        </aside>
        <div class="flex-1 min-w-0 order-1 lg:order-2">
          <app-chat-window></app-chat-window>
        </div>
      </div>
    </main>
  </div>

  <!-- Settings modal -->
  <app-settings
    [open]="showSettings"
    (closeModal)="closeSettings()"
  ></app-settings>

  <!-- Custom toasts and confirm dialog (no browser alert/confirm) -->
  <app-toast></app-toast>
  <app-confirm-dialog></app-confirm-dialog>
} @else {
  <app-auth></app-auth>
}
