@if (open) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm"
    (click)="close()"
    role="dialog"
    aria-modal="true"
    aria-labelledby="settings-title"
  >
    <div
      class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl border border-gray-200 dark:border-gray-700 w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden"
      (click)="stopPropagation($event)"
    >
      <!-- Header -->
      <div class="flex items-center justify-between px-4 sm:px-6 py-4 border-b border-gray-200 dark:border-gray-700">
        <h2 id="settings-title" class="text-lg font-semibold text-gray-900 dark:text-white">Settings</h2>
        <button
          type="button"
          (click)="close()"
          class="p-2 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
          aria-label="Close"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <!-- Tabs -->
      <div class="flex border-b border-gray-200 dark:border-gray-700 px-4 sm:px-6">
        <button
          type="button"
          class="px-4 py-3 text-sm font-medium border-b-2 transition-colors"
          [class.border-primary-600]="activeTab() === 'providers'"
          [class.text-primary-600]="activeTab() === 'providers'"
          [class.border-transparent]="activeTab() !== 'providers'"
          [class.text-gray-500]="activeTab() !== 'providers'"
          [class.dark:text-gray-400]="activeTab() !== 'providers'"
          (click)="setTab('providers')"
        >
          Model providers
        </button>
        <button
          type="button"
          class="px-4 py-3 text-sm font-medium border-b-2 transition-colors"
          [class.border-primary-600]="activeTab() === 'mcp'"
          [class.text-primary-600]="activeTab() === 'mcp'"
          [class.border-transparent]="activeTab() !== 'mcp'"
          [class.text-gray-500]="activeTab() !== 'mcp'"
          [class.dark:text-gray-400]="activeTab() !== 'mcp'"
          (click)="setTab('mcp')"
        >
          MCP servers
        </button>
      </div>

      <!-- Messages -->
      @if (error()) {
        <div class="mx-4 mt-3 p-3 rounded-lg bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-300 text-sm">
          {{ error() }}
        </div>
      }
      @if (success()) {
        <div class="mx-4 mt-3 p-3 rounded-lg bg-green-50 dark:bg-green-900/20 text-green-700 dark:text-green-300 text-sm">
          {{ success() }}
        </div>
      }

      <!-- Content -->
      <div class="flex-1 overflow-y-auto p-4 sm:p-6">
        @if (activeTab() === 'providers') {
          <app-providers-tab
            [registry]="registry()"
            [loading]="loading()"
            (refresh)="onRefresh()"
            (errorMessage)="onError($event)"
          />
        }
        @if (activeTab() === 'mcp') {
          <app-mcp-tab
            [mcpServers]="mcpServers()"
            [oauthProviders]="oauthProviders()"
            (refresh)="onRefresh()"
            (errorMessage)="onError($event)"
          />
        }
      </div>
    </div>
  </div>
}
