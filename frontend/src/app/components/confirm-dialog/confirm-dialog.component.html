@if (state.visible) {
  <div
    class="fixed inset-0 z-[9998] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm"
    data-backdrop="true"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-title"
    aria-describedby="confirm-desc"
    (click)="onBackdropClick($event)"
  >
    <div
      class="w-full max-w-md rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 shadow-xl p-5"
      (click)="$event.stopPropagation()"
    >
      <h2 id="confirm-title" class="text-lg font-semibold text-gray-900 dark:text-white m-0 mb-2">{{ state.title }}</h2>
      <p id="confirm-desc" class="text-sm text-gray-600 dark:text-gray-300 m-0 mb-5">{{ state.message }}</p>
      <div class="flex justify-end gap-2">
        <button
          type="button"
          class="px-4 py-2 text-sm font-medium rounded-lg border border-gray-300 dark:border-gray-500 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-600"
          (click)="cancel()"
        >
          {{ state.cancelLabel }}
        </button>
        @if (state.danger) {
          <button
            type="button"
            class="px-4 py-2 text-sm font-medium rounded-lg bg-red-600 text-white hover:bg-red-700 border border-red-600"
            (click)="confirm()"
          >
            {{ state.confirmLabel }}
          </button>
        } @else {
          <button
            type="button"
            class="px-4 py-2 text-sm font-medium rounded-lg bg-primary-600 text-white hover:bg-primary-700 border border-primary-600"
            (click)="confirm()"
          >
            {{ state.confirmLabel }}
          </button>
        }
      </div>
    </div>
  </div>
}
